<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WDTNDUH - When Does The Next DOORS Update Happen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>WDTNDUH</h1>
    <p>When Does The Next DOORS Update Happen?</p>
  </header>

  <main>
    <p id="status">Loading...</p>
    <p id="date"></p>

    <div id="countdown" hidden>
      <div><span id="d">0</span><small>Days</small></div>
      <div><span id="h">0</span><small>Hours</small></div>
      <div><span id="m">0</span><small>Min</small></div>
      <div><span id="s">0</span><small>Sec</small></div>
    </div>

    <label class="tz" for="tz">Your time zone:</label>
    <select id="tz"></select>

    <label class="tz" for="hh">Event time from the Roblox event page (in the time zone above):</label>
    <div class="time">
      <input id="hh" type="number" min="1" max="12" value="6" aria-label="Hour">
      <span>:</span>
